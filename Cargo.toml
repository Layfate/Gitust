[package]
name = "gitust"
version = "0.2.0"
edition = "2024"
description = "A tiny, performant, 100% native Git & GitHub desktop client"
keywords = ["git", "github", "desktop", "slint", "gui"]
categories = ["development-tools", "gui"]
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Layfate/Gitust"

# Linux .deb (built by .github/workflows/release.yml with cargo-deb).
[package.metadata.deb]
maintainer = "Layfate <343918192+Layfate@users.noreply.github.com>"
section = "devel"
# winit and fontique load the window system libraries with dlopen, so
# "$auto" (which reads the binary's links) can't see them.
depends = "$auto, git, libfontconfig1, libxkbcommon0, libxkbcommon-x11-0, libx11-xcb1, libxcursor1, libxi6"
extended-description = "Gitust keeps the everyday Git flow (see what changed, stage files, hunks or lines, commit, branch, push) in a native window that starts fast and idles at about 10 MB of memory. GitHub is optional."
assets = [
    ["target/release/gitust", "usr/bin/", "755"],
    ["assets/linux/gitust.desktop", "usr/share/applications/", "644"],
    ["assets/gitust-512.png", "usr/share/icons/hicolor/512x512/apps/gitust.png", "644"],
    ["README.md", "usr/share/doc/gitust/README.md", "644"],
]

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
# Local reads/index only. Network ops go through the Git CLI so users keep
# their credential helpers and SSH agents; no TLS/SSH stack needed here.
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
http = "1"
keyring = "4.2.0"
notify-debouncer-mini = { version = "0.7.0", default-features = false }
octocrab = { version = "0.54.9", default-features = false, features = ["default-client", "follow-redirect", "retry", "rustls", "rustls-ring", "timeout"] }
open = "5.4.5"
rfd = "0.18.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.19.0", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "process", "io-util", "macros", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Slint already uses fontique; this only switches it to load fontconfig with
# dlopen instead of linking it, so a system without fontconfig still starts
# (with Slint's built-in font) instead of failing to load the binary.
fontique = { version = "0.12.0", features = ["fontconfig-dlopen"] }
# dlopen for the AppImage's bundled window system libraries (src/linux.rs).
libc = "0.2.191"

[build-dependencies]
slint-build = "1.19.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3"
# Only for `cargo run --example render_icons` (already in the tree via Slint).
resvg = { version = "0.49.0", default-features = false }

[profile.release]
# "s" is ~20% smaller than "3" with no measurable startup difference (scripts/bench.ps1).
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Keep the C hot paths (status, diff, hashing, SQLite) at full speed.
[profile.release.package.libgit2-sys]
opt-level = 3
[profile.release.package.libsqlite3-sys]
opt-level = 3

# Fast debug builds while keeping dependencies optimised (git2/sqlite/slint are hot paths).
[profile.dev.package."*"]
opt-level = 2
