[package]
name = "gitust"
version = "0.1.0"
edition = "2024"
description = "A tiny, performant, 100% native Git & GitHub desktop client"
keywords = ["git", "github", "desktop", "slint", "gui"]
categories = ["development-tools", "gui"]
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
# Local reads/index only. Network ops go through the Git CLI so users keep
# their credential helpers and SSH agents; no TLS/SSH stack needed here.
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
http = "1"
keyring = "4.2.0"
notify-debouncer-mini = { version = "0.7.0", default-features = false }
octocrab = { version = "0.54.9", default-features = false, features = ["default-client", "follow-redirect", "retry", "rustls", "rustls-ring", "timeout"] }
open = "5.4.5"
rfd = "0.18.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.19.0", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "process", "io-util", "macros", "time"] }

[build-dependencies]
slint-build = "1.19.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3"

[profile.release]
# "s" is ~20% smaller than "3" with no measurable startup difference (scripts/bench.ps1).
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Keep the C hot paths (status, diff, hashing, SQLite) at full speed.
[profile.release.package.libgit2-sys]
opt-level = 3
[profile.release.package.libsqlite3-sys]
opt-level = 3

# Fast debug builds while keeping dependencies optimised (git2/sqlite/slint are hot paths).
[profile.dev.package."*"]
opt-level = 2
