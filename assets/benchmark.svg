<svg xmlns="http://www.w3.org/2000/svg" width="880" height="462" viewBox="0 0 880 462" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Gitust versus GitHub Desktop: memory, size on disk and startup time">
<style>
  .bg{fill:#ffffff} .card{fill:#f6f8fa;stroke:#d1d9e0} .t1{fill:#1f2328} .t2{fill:#59636e}
  .track{fill:#e7ecf0} .gd{fill:#4a7fb8} .gu{fill:#e8611f} .hero{fill:#d4561a}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .card{fill:#151b23;stroke:#30363d} .t1{fill:#e6edf3} .t2{fill:#9198a1}
    .track{fill:#212830} .gd{fill:#5b93d1} .gu{fill:#f0702c} .hero{fill:#f58a4e}
  }
  text{font-size:13px}
  .name{font-size:15px;font-weight:600} .sub{font-size:12px}
  .ratio{font-size:38px;font-weight:800;letter-spacing:-1px} .word{font-size:15px;font-weight:600}
  .val{font-size:13px;font-weight:600} .small{font-size:12px} .legend{font-size:13px;font-weight:600}
  .bar{transform-box:fill-box;transform-origin:left center;animation:grow .9s cubic-bezier(.2,.8,.2,1) backwards}
  .fade{animation:fade .5s ease-out backwards}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes fade{from{opacity:0}}
  @media (prefers-reduced-motion: reduce){.bar,.fade{animation:none}}
</style>
<rect class="bg" width="880" height="462" rx="12"/>
<rect class="gd" x="20" y="21" width="14" height="14" rx="4"/>
<text class="t1 legend" x="42" y="32.5">GitHub Desktop 3.6.7</text>
<rect class="gu" x="226.0" y="21" width="14" height="14" rx="4"/>
<text class="t1 legend" x="248.0" y="32.5">Gitust 0.1.0</text>
<text class="t2 small" x="860" y="32.5" text-anchor="end">Lower is better · median of 3 runs</text>
<rect class="card" x="20.5" y="58.5" width="411" height="171" rx="10"/>
<text class="t1 name" x="42" y="92">Memory</text>
<text class="t2 sub" x="42" y="111">private bytes</text>
<text class="t2 word fade" style="animation-delay:0.50s" x="410" y="122" text-anchor="end">less memory</text>
<text class="hero ratio fade" style="animation-delay:0.40s" x="410" y="100" text-anchor="end">26×</text>
<text class="t2" x="42" y="161.5">GitHub Desktop</text>
<rect class="track" x="150" y="146" width="182" height="22" rx="5"/>
<path class="bar gd" style="animation-delay:0.10s" d="M150.0,146.0h177.0a5,5 0 0 1 5,5v12.0a5,5 0 0 1 -5,5h-177.0z"/>
<text class="t1 val" x="342" y="161.5">267 MB</text>
<text class="t2" x="42" y="195.5">Gitust</text>
<rect class="track" x="150" y="180" width="182" height="22" rx="5"/>
<path class="bar gu" style="animation-delay:0.18s" d="M150.0,180.0h3.4a3.4384586606808827,3.4384586606808827 0 0 1 3.4384586606808827,3.4384586606808827v15.1a3.4384586606808827,3.4384586606808827 0 0 1 -3.4384586606808827,3.4384586606808827h-3.4z"/>
<text class="t1 val" x="342" y="195.5">10.1 MB</text>
<rect class="card" x="448.5" y="58.5" width="411" height="171" rx="10"/>
<text class="t1 name" x="470" y="92">Memory</text>
<text class="t2 sub" x="470" y="111">working set</text>
<text class="t2 word fade" style="animation-delay:0.62s" x="838" y="122" text-anchor="end">less memory</text>
<text class="hero ratio fade" style="animation-delay:0.52s" x="838" y="100" text-anchor="end">11×</text>
<text class="t2" x="470" y="161.5">GitHub Desktop</text>
<rect class="track" x="578" y="146" width="182" height="22" rx="5"/>
<path class="bar gd" style="animation-delay:0.22s" d="M578.0,146.0h177.0a5,5 0 0 1 5,5v12.0a5,5 0 0 1 -5,5h-177.0z"/>
<text class="t1 val" x="770" y="161.5">366 MB</text>
<text class="t2" x="470" y="195.5">Gitust</text>
<rect class="track" x="578" y="180" width="182" height="22" rx="5"/>
<path class="bar gu" style="animation-delay:0.30s" d="M578.0,180.0h11.3a5,5 0 0 1 5,5v12.0a5,5 0 0 1 -5,5h-11.3z"/>
<text class="t1 val" x="770" y="195.5">32.7 MB</text>
<rect class="card" x="20.5" y="246.5" width="411" height="171" rx="10"/>
<text class="t1 name" x="42" y="280">Size on disk</text>
<text class="t2 sub" x="42" y="299">app folder vs. one .exe</text>
<text class="t2 word fade" style="animation-delay:0.74s" x="410" y="310" text-anchor="end">smaller</text>
<text class="hero ratio fade" style="animation-delay:0.64s" x="410" y="288" text-anchor="end">35×</text>
<text class="t2" x="42" y="349.5">GitHub Desktop</text>
<rect class="track" x="150" y="334" width="182" height="22" rx="5"/>
<path class="bar gd" style="animation-delay:0.34s" d="M150.0,334.0h177.0a5,5 0 0 1 5,5v12.0a5,5 0 0 1 -5,5h-177.0z"/>
<text class="t1 val" x="342" y="349.5">582 MB</text>
<text class="t2" x="42" y="383.5">Gitust</text>
<rect class="track" x="150" y="368" width="182" height="22" rx="5"/>
<path class="bar gu" style="animation-delay:0.42s" d="M150.0,368.0h2.6a2.578125,2.578125 0 0 1 2.578125,2.578125v16.8a2.578125,2.578125 0 0 1 -2.578125,2.578125h-2.6z"/>
<text class="t1 val" x="342" y="383.5">16.5 MB</text>
<rect class="card" x="448.5" y="246.5" width="411" height="171" rx="10"/>
<text class="t1 name" x="470" y="280">Startup</text>
<text class="t2 sub" x="470" y="299">window visible after launch</text>
<text class="t2 word fade" style="animation-delay:0.86s" x="838" y="310" text-anchor="end">faster</text>
<text class="hero ratio fade" style="animation-delay:0.76s" x="838" y="288" text-anchor="end">11×</text>
<text class="t2" x="470" y="349.5">GitHub Desktop</text>
<rect class="track" x="578" y="334" width="182" height="22" rx="5"/>
<path class="bar gd" style="animation-delay:0.46s" d="M578.0,334.0h177.0a5,5 0 0 1 5,5v12.0a5,5 0 0 1 -5,5h-177.0z"/>
<text class="t1 val" x="770" y="349.5">561 ms</text>
<text class="t2" x="470" y="383.5">Gitust</text>
<rect class="track" x="578" y="368" width="182" height="22" rx="5"/>
<path class="bar gu" style="animation-delay:0.54s" d="M578.0,368.0h11.2a5,5 0 0 1 5,5v12.0a5,5 0 0 1 -5,5h-11.2z"/>
<text class="t1 val" x="770" y="383.5">50 ms</text>
<text class="t2 small" x="20" y="446">Windows 11 · AMD Ryzen 7 5700X · 32 GB · both apps idle on the same repository, all processes summed · scripts/compare.ps1</text>
