name: Audit

# Checks Cargo.lock against the RustSec advisory database: on dependency
# changes, and weekly so new advisories for existing dependencies show up.
# Vulnerabilities fail the job; "unmaintained" notices are only warnings.
on:
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
