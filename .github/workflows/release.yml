name: Release

# Push a tag like v0.1.0 to build every package and attach them to a draft
# GitHub release, or run it by hand (Actions → Release → Run workflow) to just
# get the files as build artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Repository variable (Settings → Secrets and variables → Actions → Variables).
  # Optional: without it the browser sign-in button is hidden.
  GITUST_GITHUB_CLIENT_ID: ${{ vars.GITUST_GITHUB_CLIENT_ID }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Portable zip
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.v.outputs.version }} -Out dist

      - name: MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build installer/gitust.wxs -arch x64 `
            -d Version=${{ steps.v.outputs.version }} `
            -d ExePath=target/release/gitust.exe `
            -d IconPath=assets/gitust.ico `
            -o dist/Gitust-${{ steps.v.outputs.version }}-windows-x64.msi
          # WiX also writes a debug database next to the MSI; it isn't for users.
          Remove-Item dist/*.wixpdb -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  # Linux and macOS packages are previews: they build and pass the tests in CI,
  # but haven't been tried on real machines yet.
  linux:
    runs-on: ubuntu-22.04 # older glibc, so the binary runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev

      - name: Build
        run: cargo build --release --locked

      - name: Package (.tar.gz, .deb, AppImage)
        run: |
          set -euo pipefail
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          mkdir -p dist

          t="Gitust-$v-linux-x86_64"
          mkdir -p "$t"
          cp target/release/gitust README.md LICENSE-MIT LICENSE-APACHE assets/linux/gitust.desktop "$t/"
          cp assets/gitust-512.png "$t/gitust.png"
          tar -czf "dist/$t.tar.gz" "$t"

          cargo install cargo-deb --locked
          cargo deb --no-build --output "dist/gitust_${v}_amd64.deb"

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/512x512/apps
          cp target/release/gitust AppDir/usr/bin/
          cp assets/gitust-512.png AppDir/usr/share/icons/hicolor/512x512/apps/gitust.png
          LINUXDEPLOY_OUTPUT_VERSION="$v" ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir --desktop-file assets/linux/gitust.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/gitust.png --output appimage
          mv Gitust-*.AppImage "dist/Gitust-$v-x86_64.AppImage"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build (Apple Silicon + Intel)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Package (.dmg with a universal Gitust.app)
        run: |
          set -euo pipefail
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          app=dmg/Gitust.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          lipo -create -output "$app/Contents/MacOS/gitust" \
            target/aarch64-apple-darwin/release/gitust target/x86_64-apple-darwin/release/gitust
          sed "s/VERSION/$v/g" assets/macos/Info.plist > "$app/Contents/Info.plist"

          mkdir gitust.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/gitust-512.png --out "gitust.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2)); [ $d -le 512 ] && sips -z $d $d assets/gitust-512.png --out "gitust.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns gitust.iconset -o "$app/Contents/Resources/gitust.icns"

          ln -s /Applications dmg/Applications
          hdiutil create -volname "Gitust $v" -srcfolder dmg -ov -format UDZO "dist/Gitust-$v-macos-universal.dmg"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: gitust-all
          path: dist/*

      # A draft, so you can check it before anyone sees it.
      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
