name: Release

# Push a tag like v0.1.0 to build every package and attach them to a draft
# GitHub release, or run it by hand (Actions → Release → Run workflow) to just
# get the files as build artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Repository variable (Settings → Secrets and variables → Actions → Variables).
  # Optional: without it the browser sign-in button is hidden.
  GITUST_GITHUB_CLIENT_ID: ${{ vars.GITUST_GITHUB_CLIENT_ID }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Portable zip
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.v.outputs.version }} -Out dist

      - name: MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build installer/gitust.wxs -arch x64 `
            -d Version=${{ steps.v.outputs.version }} `
            -d ExePath=target/release/gitust.exe `
            -d IconPath=assets/gitust.ico `
            -o dist/Gitust-${{ steps.v.outputs.version }}-windows-x64.msi
          # WiX also writes a debug database next to the MSI; it isn't for users.
          Remove-Item dist/*.wixpdb -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist/*

  # Linux: AppImage, .deb and .tar.gz built against glibc 2.28, with the
  # AppImage tested like the AppImage catalog does and in bare containers
  # without network (see linux.yml). The publish job waits for those tests.
  linux:
    uses: ./.github/workflows/linux.yml

  # The macOS package is a preview: it builds and passes the tests in CI, but
  # hasn't been tried on a real machine yet.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build (Apple Silicon + Intel)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Package (.dmg with a universal Gitust.app)
        run: |
          set -euo pipefail
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          app=dmg/Gitust.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          lipo -create -output "$app/Contents/MacOS/gitust" \
            target/aarch64-apple-darwin/release/gitust target/x86_64-apple-darwin/release/gitust
          sed "s/VERSION/$v/g" assets/macos/Info.plist > "$app/Contents/Info.plist"

          mkdir gitust.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/gitust-512.png --out "gitust.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2)); [ $d -le 512 ] && sips -z $d $d assets/gitust-512.png --out "gitust.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns gitust.iconset -o "$app/Contents/Resources/gitust.icns"

          ln -s /Applications dmg/Applications
          hdiutil create -volname "Gitust $v" -srcfolder dmg -ov -format UDZO "dist/Gitust-$v-macos-universal.dmg"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist/*

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      # Only the packages (dist-*), not the AppImage test screenshots and logs.
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # GitHub shows each asset's SHA-256 on the release page, so no checksum file.
      - name: List files
        run: ls -la dist && cd dist && sha256sum *

      - uses: actions/upload-artifact@v7
        with:
          name: gitust-all
          path: dist/*

      # A draft, so you can check it before anyone sees it.
      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
