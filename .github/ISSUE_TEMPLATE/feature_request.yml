name: Feature request
description: Suggest something Gitust should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or workflow, rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Gitust help?
